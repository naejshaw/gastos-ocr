<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<style>
  body { margin: 0; background: #fff; font-family: 'Courier New', Courier, monospace; }
  .receipt { padding: 18px 16px 14px; }
  p { margin: 0; font-size: 15px; line-height: 1.5; color: #111; }
  .store { text-align: center; font-weight: bold; letter-spacing: 1px; font-size: 17px; }
  .sub { text-align: center; }
  .row { display: flex; justify-content: space-between; gap: 12px; }
  .sep { text-align: center; color: #111; }
</style>
</head>
<body>
  <div class="receipt">
    <p class="store">MERCADO BOM DEMAIS</p>
    <p class="sub">CNPJ 12.345.678/0001-90</p>
    <p class="sub">N&#186; 000127  OUT 05 2026</p>
    <p class="sep">--------------------------------</p>
    <p class="row"><span>ARROZ 5 KG</span><span>R$ 22,90</span></p>
    <p class="row"><span>CAF&#201; 500 G</span><span>R$ 12,50</span></p>
    <p class="row"><span>LEITE INTEGRAL 1L</span><span>R$ 3,89</span></p>
    <p class="row"><span>P&#195;O DE FORMA</span><span>R$ 5,60</span></p>
    <p class="row"><span>BANANA PRATA KG</span><span>R$ 6,98</span></p>
    <p class="sep">--------------------------------</p>
    <p class="row"><span>TOTAL</span><span>R$ 51,87</span></p>
    <p class="row"><span>DINHEIRO</span><span>R$ 60,00</span></p>
    <p class="row"><span>TROCO</span><span>R$ 8,13</span></p>
  </div>
</body>
</html>
